<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Puff the octopus</title>
  <desc id="desc">Placeholder mascot: a chubby purple octopus juggling three agent terminal cards (orange, green, blue).</desc>
  <defs>
    <radialGradient id="head" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#d9ccff"/>
      <stop offset="45%" stop-color="#a48bf5"/>
      <stop offset="100%" stop-color="#6a4bd4"/>
    </radialGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f74ee"/>
      <stop offset="100%" stop-color="#6447cc"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2a1a66" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="200" cy="384" rx="120" ry="10" fill="#2a1a66" opacity="0.18"/>

  <!-- tentacles (drawn under the head) -->
  <g fill="none" stroke="url(#arm)" stroke-width="20" stroke-linecap="round" filter="url(#soft)">
    <path d="M140 215 Q 85 238 46 186"/>
    <path d="M150 232 Q 95 285 38 292"/>
    <path d="M170 245 Q 145 318 112 338 Q 92 352 110 362"/>
    <path d="M190 250 Q 186 322 166 362"/>
    <path d="M210 250 Q 214 322 234 362"/>
    <path d="M230 245 Q 255 318 288 338 Q 308 352 290 362"/>
    <path d="M250 232 Q 305 285 362 292"/>
    <path d="M260 215 Q 315 238 354 186"/>
  </g>
  <!-- suckers -->
  <g fill="#c7b8ff" opacity="0.7">
    <circle cx="116" cy="336" r="3.5"/><circle cx="168" cy="345" r="3.5"/>
    <circle cx="232" cy="345" r="3.5"/><circle cx="284" cy="336" r="3.5"/>
    <circle cx="88" cy="276" r="3.5"/><circle cx="312" cy="276" r="3.5"/>
  </g>

  <!-- agent cards -->
  <!-- orange: Claude Code -->
  <g filter="url(#glow)">
    <rect x="6" y="136" width="70" height="50" rx="10" fill="#1d1830" stroke="#ff9a3c" stroke-width="3"/>
    <circle cx="17" cy="147" r="2.5" fill="#ff9a3c"/><circle cx="25" cy="147" r="2.5" fill="#ff9a3c" opacity=".6"/>
    <rect x="15" y="157" width="40" height="5" rx="2.5" fill="#ff9a3c"/>
    <rect x="15" y="168" width="28" height="5" rx="2.5" fill="#ff9a3c" opacity=".55"/>
  </g>
  <!-- green: Codex -->
  <g filter="url(#glow)">
    <rect x="2" y="284" width="70" height="50" rx="10" fill="#1d1830" stroke="#3ddc84" stroke-width="3"/>
    <circle cx="13" cy="295" r="2.5" fill="#3ddc84"/><circle cx="21" cy="295" r="2.5" fill="#3ddc84" opacity=".6"/>
    <rect x="11" y="305" width="44" height="5" rx="2.5" fill="#3ddc84"/>
    <rect x="11" y="316" width="30" height="5" rx="2.5" fill="#3ddc84" opacity=".55"/>
  </g>
  <!-- blue: OpenCode -->
  <g filter="url(#glow)">
    <rect x="328" y="284" width="70" height="50" rx="10" fill="#1d1830" stroke="#4aa8ff" stroke-width="3"/>
    <circle cx="339" cy="295" r="2.5" fill="#4aa8ff"/><circle cx="347" cy="295" r="2.5" fill="#4aa8ff" opacity=".6"/>
    <rect x="337" y="305" width="44" height="5" rx="2.5" fill="#4aa8ff"/>
    <rect x="337" y="316" width="26" height="5" rx="2.5" fill="#4aa8ff" opacity=".55"/>
  </g>
  <!-- purple: shared memory graph -->
  <g filter="url(#glow)">
    <rect x="324" y="136" width="70" height="50" rx="10" fill="#1d1830" stroke="#c48bff" stroke-width="3"/>
    <g stroke="#c48bff" stroke-width="2">
      <line x1="342" y1="152" x2="362" y2="168"/><line x1="362" y1="168" x2="380" y2="150"/><line x1="342" y1="152" x2="380" y2="150"/>
    </g>
    <circle cx="342" cy="152" r="4.5" fill="#c48bff"/><circle cx="362" cy="168" r="4.5" fill="#c48bff"/><circle cx="380" cy="150" r="4.5" fill="#c48bff"/>
  </g>

  <!-- head -->
  <ellipse cx="200" cy="150" rx="106" ry="98" fill="url(#head)" filter="url(#soft)"/>
  <ellipse cx="160" cy="92" rx="38" ry="22" fill="#ffffff" opacity="0.28" transform="rotate(-20 160 92)"/>

  <!-- eyes -->
  <ellipse cx="164" cy="150" rx="25" ry="29" fill="#ffffff"/>
  <ellipse cx="236" cy="150" rx="25" ry="29" fill="#ffffff"/>
  <circle cx="168" cy="157" r="15" fill="#241a4a"/>
  <circle cx="232" cy="157" r="15" fill="#241a4a"/>
  <circle cx="174" cy="149" r="5.5" fill="#ffffff"/>
  <circle cx="238" cy="149" r="5.5" fill="#ffffff"/>
  <circle cx="163" cy="164" r="2.5" fill="#ffffff" opacity=".8"/>
  <circle cx="227" cy="164" r="2.5" fill="#ffffff" opacity=".8"/>

  <!-- cheeks + smile -->
  <ellipse cx="128" cy="190" rx="15" ry="9" fill="#ff8fc4" opacity="0.55"/>
  <ellipse cx="272" cy="190" rx="15" ry="9" fill="#ff8fc4" opacity="0.55"/>
  <path d="M186 192 Q 200 206 214 192" fill="none" stroke="#241a4a" stroke-width="5" stroke-linecap="round"/>
</svg>
