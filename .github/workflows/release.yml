name: Release installer

# Builds the Windows installer on GitHub's own machines and attaches it to a release.
#   - push a version tag (git tag v0.1.4 && git push origin v0.1.4) to publish a release
#   - or run it by hand from the Actions tab to just build it (the installer is kept as a build artifact)
# The file is always called Puff-Setup.exe, so one link always points at the newest release:
#   https://github.com/Shaurya01836/Puff/releases/latest/download/Puff-Setup.exe
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: Build the installer
        run: npm run package -w @puff/desktop

      - name: Check what was built
        shell: bash
        run: |
          file=apps/desktop/release/Puff-Setup.exe
          test -f "$file" || { echo "The installer was not built"; ls -la apps/desktop/release; exit 1; }
          size=$(stat -c %s "$file")
          echo "Puff-Setup.exe is $size bytes"
          # An installer that is only a few MB has lost the app inside it
          test "$size" -gt 50000000 || { echo "The installer is too small"; exit 1; }

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Puff-Setup
          path: apps/desktop/release/Puff-Setup.exe
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          cat > notes.md <<'EOF'
          Windows installer for Puff. Run `Puff-Setup.exe`.

          - Windows 10 or 11, 64-bit. Puff needs Docker Desktop (it starts the memory database for you) and at least one agent CLI: Claude Code, Codex or OpenCode.
          - The installer is not code-signed yet, so Windows SmartScreen may say "unknown publisher". Choose **More info**, then **Run anyway**.
          - Already installed? Run it again: it updates your install in place and keeps your projects and memory.

          See docs/INSTALL.md for the first-run steps.
          EOF
          gh release view "$tag" > /dev/null 2>&1 \
            || gh release create "$tag" --title "Puff $tag" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          gh release upload "$tag" apps/desktop/release/Puff-Setup.exe --clobber --repo "$GITHUB_REPOSITORY"
